services:
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: "rabbitmq"
    restart: always
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI (should be secured in production)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - backend
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    entrypoint: ["/bin/bash", "-c", "
      rabbitmq-server & sleep 10 && 
      rabbitmqctl add_user ${RABBITMQ_USER} ${RABBITMQ_PASS} && 
      rabbitmqctl set_user_tags ${RABBITMQ_USER} administrator && 
      rabbitmqctl set_permissions -p / ${RABBITMQ_USER} '.*' '.*' '.*' && 
      wait
      "]

  api-gateway-service:
    build:
      context: ./api-gateway-service
      target: production
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway-service/.env
      - ./.env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    command: node dist/main.js
    depends_on:
      - rabbitmq:
          condition: service_healthy
    networks:
      - backend
    

  authentication-service:
    build:
      context: ./authentication-service
      target: production
    ports:
      - "3001:3001"
    env_file:
      - ./authentication-service/.env
      - ./.env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    command: node dist/main.js
    depends_on:
      - rabbitmq:
          condition: service_healthy
    networks:
      - backend

  ent-tenders-service:
    build:
      context: ./ent-tenders-service
      target: production
    ports:
      - "3002:3002"
    env_file:
      - ./ent-tenders-service/.env
      - ./.env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    command: node dist/main.js
    depends_on:
      - rabbitmq:
          condition: service_healthy
    networks:
      - backend

  ent-offers-service:
    build:
      context: ./ent-offers-service
      target: production
    ports:
      - "3003:3003"
    env_file:
      - ./ent-offers-service/.env
      - ./.env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    command: node dist/main.js
    depends_on:
      - rabbitmq:
          condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
