          content:
            application/json: {}
  /auth/logout:
    get:
      tags:
        - Authentication Service
      summary: Logout
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: >-
            Bearer
            .pYlkdyAEsiejAOxO3vneUII6QK4Ng42jCNv-yvksu1PuGiltWuvGVG03oL_HM4hsp96qmzJYR2qgU8EnURuLlTkI9-eeQkK5BASC4FxqhvMgv8salcsOu_wjA_Bo5VeRpUAvpKAkqEy6AjNXgvOxj1a4H5oZzTxTWBPR9l1mCELlyBZjevRFbvMrXjmVlET4MV_qylV3nLEewaxrklgLJoIPYOR9cJtNZFYNUvrPNYaj3xxr4geUgd-sZ7J2A9D2LVbbSslI6a17jJMH84C5JteaXhV-Cyv2zboYvVnfwmfTMF9cJpnZYAc8vDLy0c4Un_psrtAWazqQVSPodDxRBQ
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /tender:
    post:
      tags:
        - Ent-Tenders
      summary: Create Tender
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: This is my third tender
                type: renewal
                endDate: "2025-02-28T22:00:00.000Z"
                hasInspector: false
                private: true
                city: Ramat Gan
                parcels:
                  - parcel: "1325"
                    sections:
                      - "1"
                      - "2"
                questionnaire:
                  - question: How many meters will you add?
                    type: number
                  - question: Will you plant trees around the building?
                    type: boolean
                  - question: What is your idea to make the place more appealing?
                    type: string
      parameters:
        - name: Cache-Control
          in: header
          schema:
            type: string
          example: no-cache
        - name: Postman-Token
          in: header
          schema:
            type: string
          example: <calculated when request is sent>
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Content-Length
          in: header
          schema:
            type: string
          example: <calculated when request is sent>
        - name: Host
          in: header
          schema:
            type: string
          example: <calculated when request is sent>
        - name: User-Agent
          in: header
          schema:
            type: string
          example: PostmanRuntime/7.39.1
        - name: Accept
          in: header
          schema:
            type: string
          example: "*/*"
        - name: Accept-Encoding
          in: header
          schema:
            type: string
          example: gzip, deflate, br
        - name: Connection
          in: header
          schema:
            type: string
          example: keep-alive
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /tender/{tenderId}:
    get:
      tags:
        - Ent-Tenders
      summary: Tender Details
      parameters:
        - name: tenderId
          in: path
          schema:
            type: string
          required: true
          example: 67a38b4d092c71a6e69842bf
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /list:
    get:
      tags:
        - Ent-Tenders
      summary: List Tenders
      security:
        - noauthAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: "2"
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /my-tenders:
    get:
      tags:
        - Ent-Tenders
      summary: My Tenders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: "1"
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /{tenderId}/offer:
    post:
      tags:
        - Ent-Offers
      summary: Create Offer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                tenderId: 67a3be437838e8cd8706b52a
                questionnaire:
                  - questionId: 67a3be437838e8cd8706b52c
                    answer: 23
                  - questionId: 67a3be437838e8cd8706b52d
                    answer: true
                    remark: Under my conditions
                  - questionId: 67a3be437838e8cd8706b52e
                    answer: Go take a walk
      parameters:
        - name: tenderId
          in: path
          schema:
            type: string
          required: true
          example: 67a3be437838e8cd8706b52a
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /{tenderId}:
    get:
      tags:
        - Ent-Offers
      summary: Tender Offers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: "1"
        - name: tenderId
          in: path
          schema:
            type: string
          required: true
          example: 67a3be437838e8cd8706b52a
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /my-offers:
    get:
      tags:
        - Ent-Offers
      summary: My Offers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: "1"
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
